name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast lint gate. Uses the official ruff action pinned to the same version as
  # uv.lock (keep in sync) so CI and local `uv run ruff` never diverge; config
  # is read from [tool.ruff] in pyproject.toml. No venv needed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.21"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.26"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Single venv with the union of all stage extras (the `dev` extra),
      # resolved through uv.lock.
      - name: Sync dev environment
        run: uv sync --extra dev

      # One pytest process per stage, each rooted at the stage directory so
      # stage code resolves as top-level imports (mirroring the Lambda
      # container). Prints a per-stage PASS/FAIL summary and exits non-zero if
      # any stage fails. See the script header for the full rationale.
      - name: Run tests
        run: ./scripts/test.sh

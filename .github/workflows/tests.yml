name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast lint gate. Uses the official ruff action pinned to the same version as
  # uv.lock (keep in sync) so CI and local `uv run ruff` never diverge; config
  # is read from [tool.ruff] in pyproject.toml. No venv needed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.21"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.26"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Single venv with the union of all stage extras (the `dev` extra),
      # resolved through uv.lock.
      - name: Sync dev environment
        run: uv sync --extra dev

      # One pytest process per stage, each rooted at the stage directory so
      # stage code resolves as top-level imports (mirroring the Lambda
      # container). Prints a per-stage PASS/FAIL summary and exits non-zero if
      # any stage fails. See the script header for the full rationale.
      # --cov writes a per-stage .coverage.<stage> data file at the repo root.
      - name: Run tests
        run: ./scripts/test.sh --cov

      # Merge the per-stage data files into one report. The files record unique
      # repo-relative paths, so they combine without a [paths] mapping; the
      # shared utilities/ package is credited across all stages that exercise it.
      - name: Combine coverage
        if: ${{ !cancelled() }}
        run: |
          uv run coverage combine
          uv run coverage report
          uv run coverage xml -o coverage.xml

      # Uses the repo upload token (CODECOV_TOKEN secret). Tokenless uploads on
      # this org-owned repo were accepted into storage but never processed
      # (commit stuck at state=None, badge "unknown"); the token authorizes
      # processing. Non-fatal so a Codecov outage never fails the build;
      # `verbose` surfaces upload detail in the job log for debugging.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

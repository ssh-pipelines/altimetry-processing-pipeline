common:
  product_type: high_latitude
  discovery_type: thredds
  # Being onboarded in dev. A manual dev run needs true (start_run refuses a
  # line with no enabled contributor).
  enabled: true
  # First and last granule in the catalog as of 2026-11-23; the mission is still
  # publishing. Two orbit phases, both in scope as one range: the 35-day repeat
  # orbit, cycles 1-35 (1002 passes; cycle 35 ends at pass 522 on 2016-07-04),
  # and the drifting orbit from 2016-07-04, cycles 100-206 (1002 passes per
  # 35-day cycle). The renumbering keeps (cycle, pass) unique across the switch,
  # and the phases meet with no gap. Gaps upstream (2014-10-06..10-09,
  # 2023-01-29..02-08, and three under a day in 2019, 2022 and 2023) become
  # interior gaps of empty daily files.
  start_date: "2013-03-14"
  end_date: "2026-10-05"
  ground_speed: 0   # PLACEHOLDER: measured in onboarding pass 1
  intermission_bias: 0   # PLACEHOLDER: measured from the pass 2 p1 crossovers
  sample_period: 1.0   # PLACEHOLDER: measured in onboarding pass 1
  collections:
    - shortname: dataset-l2p-uncross-calibrated-ntc-sla-al
      thredds_collection: dataset-l2p-uncross-calibrated-ntc-sla-al
      thredds_version: version_04_00
      priority: 1
      source_label: "NTC SARAL/AltiKa Global Ocean Along track Sea Level Anomalies L2P products"
      source_url: "https://tds-odatis.aviso.altimetry.fr/thredds/catalog/dataset-l2p-uncross-calibrated-ntc-sla-al/version_04_00/catalog.html"
      reference: "https://www.aviso.altimetry.fr/"

pipeline_init: {}

daily_files:
  smoothing:
    sigma: 15

finalizer:
  # offset is a manual datum tie, kept as a separate lever from the measured
  # intermission_bias (read from common). For L2P the intermission bias is the
  # absolute tie, so offset is a deliberate no-op.
  offset: 0.0
  # Inherited; to be checked against the p2 reference crossover statistics.
  pass_flag:
    mean_num: 15.0
    rms_num: 25.0
    mean_threshold: 0.1
    rms_threshold: 0.27

xover:
  crossover_type: reference
  # The published reference along-track product, not a source: there is one
  # released along-track line per identity, so there is no version to choose.
  reference_product: NASA-SSH
  # The reference mission's repeat period, not AltiKa's: on the reference path
  # it only sets the origin-split gap threshold in find_reference_crossovers.
  cycle_length: 9.9156
  # window_size/window_padding are interpreted as a CENTERED window for
  # reference crossovers (±): the reference mission repeats its ground track
  # every ~9.9 days, so ~12 days captures a before/after bracket for most
  # crossings. A wider window (~20) brackets every crossing; calibrate later.
  window_size: 12
  window_padding: 2
  max_pass_number: 9999

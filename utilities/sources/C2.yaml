common:
  product_type: high_latitude
  discovery_type: thredds
  # Required for a manual dev run (start_run refuses a line with no enabled
  # contributor). Goes back to false once onboarding is done unless C2 is going
  # to production.
  enabled: true
  # First and last granule in the catalog as of 2026-10-29; the mission is still
  # publishing. Two orbit phases, both in scope as one range: cycles 7-133
  # (840 passes, ~29-day sub-cycle) and, after the 2020 CRYO2ICE orbit raise,
  # cycles 200-286 (724 passes, ~25-day sub-cycle). The renumbering keeps
  # (cycle, pass) unique across the switch. Gaps upstream (2010-08-12..09-06,
  # 2010-10-01..10-20, 2013-10-02..10-11, 2020-06-01..06-03, 2024-12-13..12-15)
  # become interior gaps of empty daily files.
  start_date: "2010-07-16"
  end_date: "2026-07-12"
  # Measured over two 14-day P1 windows, one per orbit phase: 2018-07-11..07-24
  # (6.7606 km/s, 78 passes) and 2023-07-11..07-24 (6.7554 km/s, 78 passes). The
  # 0.08% step is the orbit raise; one value is well inside what knot placement
  # and the smoothing filter resolve.
  ground_speed: 6.7592   # km/s, median ground speed over 154 long passes, both windows (tools/compute_ground_speed.py)
  intermission_bias: 0   # PLACEHOLDER, measured in onboarding step 5
  sample_period: 0.943437   # s, median sample step over 808 passes, both windows; identical in each phase
  collections:
    - shortname: dataset-l2p-uncross-calibrated-ntc-sla-c2
      thredds_collection: dataset-l2p-uncross-calibrated-ntc-sla-c2
      thredds_version: version_04_00
      priority: 1
      source_label: "NTC Cryosat-2 Global Ocean Along track Sea Level Anomalies L2P products"
      source_url: "https://tds-odatis.aviso.altimetry.fr/thredds/catalog/dataset-l2p-uncross-calibrated-ntc-sla-c2/version_04_00/catalog.html"
      reference: "https://www.aviso.altimetry.fr/"

pipeline_init: {}

daily_files:
  smoothing:
    sigma: 15

finalizer:
  # offset is a manual datum tie, kept as a separate lever from the measured
  # intermission_bias (read from common). For L2P the intermission bias is the
  # absolute tie, so offset is a deliberate no-op.
  offset: 0.0
  # Inherited unchanged; recalibrated against p2 crossover statistics in
  # onboarding step 7.
  pass_flag:
    mean_num: 15.0
    rms_num: 25.0
    mean_threshold: 0.1
    rms_threshold: 0.27

xover:
  crossover_type: reference
  # The published reference along-track product, not a source: there is one
  # released along-track line per identity, so there is no version to choose.
  reference_product: NASA-SSH
  # The reference mission's repeat period, not CryoSat-2's: on the reference
  # path it only sets the origin-split gap threshold in find_reference_crossovers.
  cycle_length: 9.9156
  # window_size/window_padding are interpreted as a CENTERED window for
  # reference crossovers (±): the reference mission repeats its ground track
  # every ~9.9 days, so ~12 days captures a before/after bracket for most
  # crossings. A wider window (~20) brackets every crossing; calibrate later.
  window_size: 12
  window_padding: 2
  max_pass_number: 9999

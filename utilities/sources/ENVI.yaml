common:
  product_type: high_latitude
  discovery_type: thredds
  # Being onboarded in dev. A manual dev run needs true (start_run refuses a
  # line with no enabled contributor).
  enabled: true
  # First and last granule in the catalog as of 2026-11-24; the mission ended in
  # 2012. Two orbit phases, both in scope as one range: the 35-day repeat orbit,
  # cycles 6-94 (1002 passes; cycle 94 ends at pass 145 on 2010-10-23), and the
  # lowered 30-day orbit from 2010-10-26, cycles 95-113 (862 passes; cycle 95
  # starts at pass 817). The numbering keeps (cycle, pass) unique across the
  # switch. 48 days have no granule upstream, 21 of them in 2002-05..06 and none
  # longer than 3 days after that; they become interior gaps of empty daily files.
  start_date: "2002-05-14"
  end_date: "2012-04-08"
  # Measured over two 14-day P1 windows, one per orbit phase: 2006-08-01..08-14
  # (6.7198 km/s, 70 passes, p5-p95 6.7165-6.7220) and 2011-07-25..08-07
  # (6.7437 km/s, 79 passes, p5-p95 6.7403-6.7463). The 0.36% step is the 2010
  # orbit lowering.
  ground_speed: 6.7399   # km/s, median ground speed over 143 long passes, both windows (tools/compute_ground_speed.py)
  intermission_bias: 0   # PLACEHOLDER: measured from the pass 2 p1 crossovers
  sample_period: 1.114000   # s, median sample step over 797 passes, both windows; 1.114008 and 1.114000 per phase
  # tools/compute_sampling_drift.py, same windows: local period within 0.001%, ambiguous-gap samples 0% (worst cycle 0%)
  collections:
    - shortname: dataset-l2p-uncross-calibrated-ntc-sla-en
      thredds_collection: dataset-l2p-uncross-calibrated-ntc-sla-en
      thredds_version: version_04_00
      priority: 1
      source_label: "NTC Envisat Global Ocean Along track Sea Level Anomalies L2P products"
      source_url: "https://tds-odatis.aviso.altimetry.fr/thredds/catalog/dataset-l2p-uncross-calibrated-ntc-sla-en/version_04_00/catalog.html"
      reference: "https://www.aviso.altimetry.fr/"

pipeline_init: {}

daily_files:
  smoothing:
    sigma: 15

finalizer:
  # offset is a manual datum tie, kept as a separate lever from the measured
  # intermission_bias (read from common). For L2P the intermission bias is the
  # absolute tie, so offset is a deliberate no-op.
  offset: 0.0
  # Inherited; to be checked against the p2 reference crossover statistics.
  pass_flag:
    mean_num: 15.0
    rms_num: 25.0
    mean_threshold: 0.1
    rms_threshold: 0.27

xover:
  crossover_type: reference
  # The published reference along-track product, not a source: there is one
  # released along-track line per identity, so there is no version to choose.
  reference_product: NASA-SSH
  # The reference mission's repeat period, not Envisat's: on the reference path
  # it only sets the origin-split gap threshold in find_reference_crossovers.
  cycle_length: 9.9156
  # window_size/window_padding are interpreted as a CENTERED window for
  # reference crossovers (±): the reference mission repeats its ground track
  # every ~9.9 days, so ~12 days captures a before/after bracket for most
  # crossings. A wider window (~20) brackets every crossing; calibrate later.
  window_size: 12
  window_padding: 2
  max_pass_number: 9999

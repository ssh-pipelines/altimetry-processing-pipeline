common:
  product_type: reference
  discovery_type: s3_bucket
  unify: false
  start_date: "2020-01-01"
  ground_speed: 5.7582   # km/s, median 1 Hz ground speed
  source_bucket: "example-source-bucket"
  source_prefix_pattern: "data/{source}/{year}"
  source_filename_pattern: "{source}_{date}.nc"
  cycle_index_key: "data/EXAMPLE_S3/cycle_index.json"
  collections:
    - shortname: ""
      source_label: "Example S3-hosted dataset"
      source_url: "https://example.com/dataset"
      reference: "https://doi.org/10.0000/example"

pipeline_init: {}

daily_files:
  source_mss: DTU15
  target_mss: DTU21
  mss_diff_file: DTU15_minus_DTU21.nc
  smoothing:
    sigma: 15

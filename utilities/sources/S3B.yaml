common:
  product_type: high_latitude
  discovery_type: thredds
  unify: false
  start_date: "2018-11-24"
  end_date: "2026-04-10"
  ground_speed: 6.6943   # km/s, median 1 Hz ground speed over 179 long passes (tools/compute_ground_speed.py)
  intermission_bias: 0.0209   # m, median (ssh1 - ssh2) over 3158711 reference crossovers vs NASA-SSH
  collections:
    - shortname: dataset-l2p-uncross-calibrated-ntc-sla-s3b-1hz
      thredds_collection: dataset-l2p-uncross-calibrated-ntc-sla-s3b-1hz
      thredds_version: version_04_00
      priority: 1
      source_label: "NTC Sentinel-3B Global Ocean Along track Sea Level Anomalies L2P products"
      source_url: "https://tds-odatis.aviso.altimetry.fr/thredds/catalog/dataset-l2p-uncross-calibrated-ntc-sla-s3b-1hz/version_04_00/catalog.html"
      reference: "https://www.aviso.altimetry.fr/"

pipeline_init: {}

daily_files:
  smoothing:
    sigma: 15

xover:
  crossover_type: reference
  reference_source: NASA-SSH
  reference_version: p3
  cycle_length: 9.9156
  # window_size/window_padding are interpreted as a CENTERED window for
  # reference crossovers (±): the reference mission repeats its ground track
  # every ~9.9 days, so ~12 days captures a before/after bracket for most
  # crossings. A wider window (~20) brackets every crossing; calibrate later.
  window_size: 12
  window_padding: 2
  max_pass_number: 9999

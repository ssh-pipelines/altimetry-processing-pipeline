# Declared build/deploy facts per Target. See CONTEXT.md -> Build & deploy and
# docs/adr/0004-target-registry.md.
#
# Existence and packaging kind are DERIVED from the filesystem (a Dockerfile =>
# container, an infra app.py => zip). This file declares only the facts that
# can't be reliably derived:
#   heavy         - container image FROMs pipeline_runtime via the BASE_IMAGE
#                   override (container targets only; guarded by a test against
#                   the Dockerfile's actual base parameterization)
#   deployable    - target maps to a Lambda the deploy step updates
#   function      - explicit Lambda name, overriding the ${stage}-${name} default
#                   (for stage-agnostic singletons that share one function)
#   deploy_stages - stages whose deploy updates this Lambda (default: all)
#
# Defaults: heavy=false, deployable=true. Every target MUST be listed so the
# consistency test can pin this manifest to the filesystem. This file is
# path-less so it survives directory moves (e.g. the planned pipeline/ -> src/).
targets:
  # ── container — heavy stages (FROM pipeline_runtime) ──────────────────
  bad_pass:      {heavy: true}
  daily_files:   {heavy: true}
  finalizer:     {heavy: true}
  oer:           {heavy: true}
  xover:         {heavy: true}
  enso:          {heavy: true}
  indicators:    {heavy: true}
  simple_grids:  {heavy: true}

  # ── container — lightweight stages (literal FROM lambda/python) ───────
  pipeline_init: {}
  unifier:       {}
  run_summary:   {}  # orchestration Lambda; ships utilities (see ADR 0005)

  # ── container — base image (built + pushed, never deployed) ───────────
  pipeline_runtime: {deployable: false}

  # ── zip — infra Lambdas ───────────────────────────────────────────────
  failure_handling: {}
  # Stage-agnostic singleton: one shared function (podaac_cred_update) refreshes
  # PODAAC/EDL creds into fixed Secrets Manager secrets for every stage. Deployed
  # only from prod so a dev push can't overwrite the function prod relies on.
  podaac_auth:      {function: podaac_cred_update, deploy_stages: [prod]}
  rewrite_manifest: {}
  set_sg_jobs:      {}
